name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, scan, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check app scripts tests
          ruff format --check app scripts tests

      - name: Security scan (bandit)
        run: bandit -r app scripts -q

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Generate demo data
        run: python scripts/generate_data.py

      - name: Demo data is reproducible
        # The generator is seeded: regenerating must give byte-identical files to the committed ones.
        run: git diff --exit-code -- data/

      - name: Build warehouse (input contracts + SQL + data tests)
        run: python scripts/build_warehouse.py

      - name: Tests (unit, pipeline, validation, security, app smoke)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
